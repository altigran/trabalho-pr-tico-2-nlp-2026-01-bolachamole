# Configuração B de fine-tuning (LoRA/QLoRA) — Fase 3
# Difere da A em pelo menos um hiperparâmetro de treino (aqui: learning_rate e épocas).

seed: 42

model:
  base_model: "Qwen/Qwen2.5-3B-Instruct"
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"

train:
  learning_rate: 5.0e-5      # <- diferente da config A
  num_train_epochs: 3        # <- diferente da config A
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  max_seq_length: 2048
  output_dir: "outputs/lora_b"
